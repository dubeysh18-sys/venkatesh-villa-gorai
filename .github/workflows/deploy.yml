name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Use the runner's installed Chrome, whose sandbox is configured for
      # Ubuntu. Downloaded Playwright Chromium cannot start under AppArmor.
      - name: Select installed Chrome (for Lighthouse CI)
        run: |
          CHROME_BIN="$(command -v google-chrome)"
          "$CHROME_BIN" --version
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      # A project page (https://<user>.github.io/<repo>/) is served under a
      # sub-path, so every internal link must be prefixed with /<repo>/.
      # The one exception is a "<user>.github.io" repo itself, which GitHub
      # always serves at the domain root with no prefix. If a CNAME file
      # exists (custom domain configured), the site also serves from the
      # root, so PATH_PREFIX is forced to "/" either way.
      - name: Compute PATH_PREFIX
        id: prefix
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -f "src/CNAME" ] || [[ "$REPO_NAME" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      # html-validate/linkinator/Lighthouse all resolve root-relative URLs
      # (the ones every page emits, e.g. /assets/main.js) against whatever
      # is physically at _site/'s own root. That only lines up when the
      # build was made with PATH_PREFIX "/" -- a build made with a real
      # sub-path prefix emits /venkatesh-villa-gorai/assets/main.js, which
      # none of these tools can resolve against a plain directory/localhost
      # scan (there's no such nested folder; the prefix is a GitHub Pages
      # *serving* concern, not a file-layout one). So: build once at root
      # for every local/CI check, then rebuild with the real prefix only
      # for the artifact that actually gets deployed.
      - name: Build site (root prefix, for checks)
        run: npm run build

      - name: HTML validate + link check
        run: npm run check

      - name: Lighthouse CI (fails below the Section 7.6 / 12 thresholds)
        run: npx lhci autorun --config=./lighthouserc.json

      - name: Build site (real PATH_PREFIX, for deploy)
        env:
          PATH_PREFIX: ${{ steps.prefix.outputs.value }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
